<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#1c1c1e"/>
  <g transform="translate(50,50)" stroke="#f5a623" stroke-width="3.5" fill="none">
    <!-- Three electron orbital ellipses rotated to form an atom -->
    <ellipse rx="30" ry="12"/>
    <ellipse rx="30" ry="12" transform="rotate(60)"/>
    <ellipse rx="30" ry="12" transform="rotate(120)"/>
  </g>
  <!-- Nucleus -->
  <circle cx="50" cy="50" r="6" fill="#4dd0e1"/>
  <!-- Electrons -->
  <circle cx="80" cy="50" r="4" fill="#f5a623"/>
  <circle cx="35" cy="24" r="4" fill="#f5a623"/>
  <circle cx="35" cy="76" r="4" fill="#f5a623"/>
</svg>
